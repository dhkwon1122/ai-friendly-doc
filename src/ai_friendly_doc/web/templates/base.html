<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ai-friendly-doc{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      max-width: 880px;
      margin: 0 auto;
      padding: 1.5rem;
      line-height: 1.55;
    }
    nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    nav a { margin-right: 1rem; text-decoration: none; }
    .brand { font-weight: 700; text-decoration: none; }
    form { display: flex; flex-direction: column; gap: 0.75rem; max-width: 480px; }
    label { font-weight: 600; font-size: 0.9rem; }
    input[type=text], input[type=password], input[type=email], textarea, select {
      padding: 0.5rem;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #8886;
    }
    textarea { min-height: 100px; font-family: monospace; }
    button {
      padding: 0.55rem 1rem;
      border-radius: 6px;
      border: none;
      background: #2563eb;
      color: white;
      font-weight: 600;
      cursor: pointer;
      width: fit-content;
    }
    button.secondary { background: #6b7280; }
    .error { background: #fee2e2; color: #991b1b; padding: 0.6rem 0.9rem; border-radius: 6px; }
    .notice { background: #dcfce7; color: #166534; padding: 0.6rem 0.9rem; border-radius: 6px; }
    .info { background: #dbeafe; color: #1e40af; padding: 0.6rem 0.9rem; border-radius: 6px; }
    .hint { font-size: 0.85rem; opacity: 0.75; }
    fieldset { border: 1px solid #8886; border-radius: 8px; }
    table { border-collapse: collapse; width: 100%; margin: 0.75rem 0; }
    th, td { border: 1px solid #8886; padding: 0.4rem 0.6rem; text-align: left; }
    .report { border-top: 1px solid #8886; margin-top: 1.5rem; padding-top: 1rem; }
    .guideline-ref {
      border: 1px solid #8886;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 1.25rem;
      max-width: 640px;
    }
    .guideline-ref summary { cursor: pointer; font-weight: 600; }
    .guideline-ref h3 { margin: 0.9rem 0 0.3rem; font-size: 0.95rem; }
    .guideline-ref ol { margin: 0.3rem 0; padding-left: 1.4rem; }
    .guideline-ref li { margin: 0.15rem 0; }
    .doc-compare {
      max-width: 1200px;
      margin: 1.5rem auto 0;
    }
    .doc-compare-page {
      border: 1px solid #8886;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 0.75rem;
    }
    .doc-compare-page summary { cursor: pointer; font-weight: 600; }
    .doc-compare-columns {
      display: flex;
      gap: 1rem;
      margin-top: 0.75rem;
      flex-wrap: wrap;
    }
    .doc-pane {
      flex: 1 1 320px;
      min-width: 0;
    }
    .doc-pane h4 { margin: 0 0 0.4rem; font-size: 0.9rem; }
    .doc-pane pre {
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 480px;
      overflow-y: auto;
      background: #8881;
      border-radius: 6px;
      padding: 0.75rem;
      font-size: 0.85rem;
      margin: 0;
    }
    .report-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .report-actions form {
      flex-direction: row;
      max-width: none;
      gap: 0.5rem;
      align-items: center;
    }
    button:disabled { opacity: 0.6; cursor: progress; }
    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .original-link {
      font-size: 0.8rem;
      font-weight: 400;
      margin-left: 0.5rem;
    }
  </style>
</head>
<body>
  <nav>
    <a class="brand" href="/">ai-friendly-doc</a>
    <div>
      {% if user %}
        <a href="/analyze">분석</a>
        <a href="/settings">설정</a>
        <span class="hint">{{ user.username }}</span>
        <form action="/logout" method="post" style="display:inline">
          <button class="secondary" type="submit">로그아웃</button>
        </form>
      {% else %}
        <a href="/login">로그인</a>
        <a href="/register">회원가입</a>
      {% endif %}
    </div>
  </nav>
  {% block content %}{% endblock %}
  <script>
    // 분석/이메일 발송 등은 LLM 호출 때문에 몇십 초씩 걸릴 수 있는데, 폼
    // 제출은 페이지 전체를 다시 불러오는 방식이라 그동안 화면에 아무
    // 변화가 없어 눌렸는지조차 알기 어렵다. 제출 시 버튼을 바로 비활성화하고
    // 문구를 바꿔서 "처리 중"임을 보여준다.
    // 폼 하나에 formaction이 다른 버튼(문서 조회/AI 분석/최종 수정본 제안)이
    // 여러 개 있을 수 있어서, querySelector로 첫 버튼을 집으면 실제로 누른
    // 버튼과 다를 수 있다 - e.submitter로 실제 클릭된 버튼을 정확히 집는다.
    document.addEventListener('submit', function (e) {
      var form = e.target;
      var btn = e.submitter || form.querySelector('button[type=submit]');
      if (!btn || btn.disabled) return;
      var original = btn.textContent;
      btn.textContent = '처리 중...';
      btn.disabled = true;
      // 다운로드 폼은 파일이 응답으로 내려올 뿐 페이지 이동이 없어서
      // 버튼이 영영 비활성 상태로 남는다 - 잠시 후 원래대로 되돌린다.
      if (form.classList.contains('download-form')) {
        setTimeout(function () {
          btn.textContent = original;
          btn.disabled = false;
        }, 4000);
      }
    });
  </script>
</body>
</html>
