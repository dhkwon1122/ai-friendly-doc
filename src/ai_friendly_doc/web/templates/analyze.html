{% extends "base.html" %}
{% block title %}분석 - ai-friendly-doc{% endblock %}
{% block content %}
<h1>Confluence 문서 분석</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/analyze">
  <fieldset>
    <legend>대상</legend>
    <label><input type="radio" name="mode" value="page_ids" {% if mode != 'space_key' %}checked{% endif %}> 페이지 ID (한 줄에 하나씩, 또는 쉼표로 구분)</label>
    <label><input type="radio" name="mode" value="space_key" {% if mode == 'space_key' %}checked{% endif %}> 스페이스 키 (스페이스 내 모든 페이지)</label>
  </fieldset>
  <textarea name="value" placeholder="예: 123456&#10;234567&#10;또는 ENG">{{ value or '' }}</textarea>
  <button type="submit">분석 실행</button>
</form>

{% if report_html %}
<div class="report">
  <form method="post" action="/analyze/download">
    <input type="hidden" name="mode" value="{{ mode }}">
    <input type="hidden" name="value" value="{{ value }}">
    <button class="secondary" type="submit">Markdown으로 다운로드</button>
  </form>
  {{ report_html | safe }}
</div>
{% endif %}
{% endblock %}
