services:
  web:
    build:
      context: .
      args:
        # .env에 PIP_INDEX_URL을 지정해두면 사내 PyPI 저장소로 빌드한다.
        # 지정 안 하면 Dockerfile 기본값(공개 PyPI)을 그대로 쓴다.
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: ai-friendly-doc-web:latest
    restart: unless-stopped
    ports:
      - "12345:12345"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 12345
    extra_hosts:
      # 이 서버에서 이미 docker로 떠 있는 PostgreSQL(및 vLLM)에 호스트로
      # 노출된 포트로 접속하기 위함. .env의 DATABASE_URL에서
      # host.docker.internal을 postgres 접속 호스트로 사용하면 된다.
      - "host.docker.internal:host-gateway"
